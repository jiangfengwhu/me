name: Refresh GitHub profile
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-profile
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync-github.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save refreshed public data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/githubSnapshot.json public/assets/github
          git diff --cached --quiet && exit 0
          git commit -m "Refresh public GitHub profile snapshot"
          git push
